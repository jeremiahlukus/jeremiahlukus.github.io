<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jeremiah Parrack — Lead Software Engineer, Flutter Developer, DevOps &amp; Cloud Architect">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jeremiah Parrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jeremiah Parrack — Lead Software Engineer</title>

  <link rel="canonical" href="https://jparrack.com/">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Jeremiah Parrack — Lead Software Engineer">
  <meta property="og:description" content="Jeremiah Parrack — Lead Software Engineer, Flutter developer, and creator of FlowJitsu, a BJJ training journal app.">
  <meta property="og:url" content="https://jparrack.com/">
  <meta property="og:image" content="https://jparrack.com/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Structured data: Jeremiah Parrack (entity hub) + FlowJitsu -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://jparrack.com/#jeremiah",
        "name": "Jeremiah Parrack",
        "url": "https://jparrack.com/",
        "jobTitle": "Lead Software Engineer",
        "description": "Jeremiah Parrack is a Lead Software Engineer and Flutter developer, and the creator of FlowJitsu — a Brazilian Jiu-Jitsu training journal app for iOS and Android.",
        "sameAs": [
          "https://www.linkedin.com/in/jeremiahlukus/",
          "https://github.com/jeremiahlukus/",
          "https://apps.apple.com/us/developer/jeremiah-parrack/id1376363500",
          "https://flowjitsu.app/"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://jparrack.com/#website",
        "url": "https://jparrack.com/",
        "name": "Jeremiah Parrack",
        "publisher": { "@id": "https://jparrack.com/#jeremiah" }
      },
      {
        "@type": "MobileApplication",
        "name": "FlowJitsu",
        "operatingSystem": "iOS, Android",
        "applicationCategory": "SportsApplication",
        "url": "https://flowjitsu.app/",
        "author": { "@id": "https://jparrack.com/#jeremiah" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    ]
  }
  </script>

  <link rel="manifest" href="manifest.json">

  <!-- CanvasKit is served from the CDN (see the build workflow); open the
       connection now so it is warm by the time the bootstrap requests it. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Preload the first-load critical path. Without these the browser cannot
       discover main.dart.js until flutter_bootstrap.js has downloaded and run,
       and cannot discover the fonts until the engine has booted and fetched
       FontManifest.json — measured at ~90ms and ~460ms of dead waterfall. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/InstrumentSerif-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/IBMPlexSans-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/IBMPlexMono-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/IBMPlexMono-Medium.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/IBMPlexSans-SemiBold.ttf" as="fetch" crossorigin>


  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #14110E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 0;
      background: #E0A356;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      color: #14110E;
      letter-spacing: 0.5px;
    }

    .name {
      color: white;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #2E2823;
      border-top-color: #E0A356;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">JP</div>
    <div class="name">Jeremiah Parrack</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hide');
        setTimeout(function() { el.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
